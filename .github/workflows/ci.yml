name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  service:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: payments-api
            package: payments_api
          - service: webhook-service
            package: webhook_service
          - service: mock-merchant
            package: mock_merchant
          - service: risk-service
            package: risk_service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test with coverage
        run: >-
          uv run pytest --cov=${{ matrix.package }} --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-coverage
          path: services/${{ matrix.service }}/coverage.xml
          if-no-files-found: warn

  # The single required status check for main: green only when every service passed.
  test:
    needs: service
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All services passed
        run: test "${{ needs.service.result }}" = "success"
