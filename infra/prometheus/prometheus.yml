# The services run on the host (uv run ...), so Prometheus scrapes them through
# host.docker.internal. In Kubernetes these become service discovery targets.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: payments-api
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: outbox-relay
    static_configs:
      - targets: ["host.docker.internal:9101"]
  - job_name: reconciliation
    static_configs:
      - targets: ["host.docker.internal:9102"]
  - job_name: webhook-service
    static_configs:
      - targets: ["host.docker.internal:8001"]
  - job_name: webhook-consumer
    static_configs:
      - targets: ["host.docker.internal:9103"]
  - job_name: webhook-delivery-worker
    static_configs:
      - targets: ["host.docker.internal:9104"]
  - job_name: mock-merchant
    static_configs:
      - targets: ["host.docker.internal:8002"]
  - job_name: risk-service
    static_configs:
      - targets: ["host.docker.internal:8003"]
