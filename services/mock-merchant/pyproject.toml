[project]
name = "mock-merchant"
version = "0.1.0"
description = "A fake merchant that verifies Settle webhook signatures and fails on purpose."
authors = [
    { name = "Dharm Patel", email = "dharmpatel0002@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.16.3",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

